version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: support-postgres
    restart: always
    environment:
      POSTGRES_DB: support_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - support-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  support-backend:
    build: ./support-backend
    container_name: support-backend
    restart: always
    ports:
      - "2400:2400"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=2400
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=support_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - JWT_SECRET=your-super-secret-key
      - JWT_EXPIRE=30d
      - CORS_ORIGIN=*
    networks:
      - support-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:2400/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  support-app:
    build:
      context: ./support-app
      args:
        - VITE_API_URL=http://support-backend:2400/api
    container_name: support-app
    restart: always
    ports:
      - "7500:80"
    depends_on:
      - support-backend
    networks:
      - support-network

networks:
  support-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
